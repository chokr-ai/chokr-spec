[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chokr-spec"
dynamic = ["version"]
readme = "README.md"
description = "CHOKR protocol for AI agent governance: JSON Schemas, registries and conformance vectors, with a reference checker."
requires-python = ">=3.12"
authors = [{ name = "chokr-ai" }]
keywords = [
  "chokr", "ai-governance", "agent-governance", "ai-agents", "agentic-ai", "agent-security", "llm-guardrails",
  "protocol", "specification", "json-schema", "conformance-tests", "audit-trail", "audit-ledger", "tamper-evident",
  "hash-chain", "canonical-json", "signed-verdict", "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "rfc8785>=0.1.4,<0.2",
  "cryptography>=43,<51",
]

[project.urls]
Homepage = "https://github.com/chokr-ai/chokr-spec"
Repository = "https://github.com/chokr-ai/chokr-spec"
Issues = "https://github.com/chokr-ai/chokr-spec/issues"

[project.scripts]
chokr-spec = "chokr_spec.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-jsonschema>=4.22",
  "ruamel.yaml>=0.18,<1",
  "import-linter>=2.0",
  "pip-audit>=2.7",
]

[tool.hatch.version]
path = "src/chokr_spec/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chokr_spec"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "chokr_spec/data/schemas"
"registry" = "chokr_spec/data/registry"
"vectors" = "chokr_spec/data/vectors"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/schemas", "/registry", "/vectors", "/tools", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF", "S", "C4", "PIE", "PERF", "PTH", "T20", "W"]
ignore = ["RUF012", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT006", "PT011", "PT012", "PT018", "E501", "S101", "S105", "S106"]
"tools/**" = ["T201"]
"src/chokr_spec/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/chokr_spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["chokr_spec"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$", "if __name__ == .__main__.:"]

[tool.importlinter]
root_package = "chokr_spec"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The protocol data imports no product and no network library"
type = "forbidden"
source_modules = ["chokr_spec"]
forbidden_modules = ["chokr", "cplang", "pydantic", "httpx", "requests", "aiohttp", "urllib3", "fastapi"]
allow_indirect_imports = true
