repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: format
        name: ruff format
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: spec
        name: protocol data checks
        entry: uv run python tools/check_spec.py
        language: system
        pass_filenames: false
