name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: lint, format, types, data, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Schemas, registries and vectors are consistent
        run: uv run python tools/check_spec.py
      - name: Lock file is current
        run: uv lock --check
        env:
          UV_FROZEN: "0"
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o requirements.audit.txt
          uv run pip-audit --requirement requirements.audit.txt --disable-pip --no-deps

  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every Python on Linux; one Python on the platforms that bill at a higher rate.
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-groups
      - name: Tests with branch coverage (the gate is in pyproject.toml)
        run: uv run pytest --cov
      - name: Conformance vectors
        run: uv run chokr-spec check --report conformance-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: conformance-report
          path: conformance-report.json

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: Distribution metadata is valid
        run: uvx twine@7.0.0 check dist/*
      - name: The wheel installs in a clean environment and carries its data
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd "$(mktemp -d)"
          /tmp/clean/bin/chokr-spec --version
          /tmp/clean/bin/chokr-spec check
      - name: The sdist builds a wheel on its own
        run: |
          uv venv /tmp/sdist
          uv pip install --python /tmp/sdist/bin/python dist/*.tar.gz
          cd "$(mktemp -d)"
          /tmp/sdist/bin/chokr-spec check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/*
