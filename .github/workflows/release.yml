name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - name: The tag matches the package version
        run: |
          version="$(uv run python -c 'import chokr_spec; print(chokr_spec.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python tools/check_spec.py
      - run: uv run pytest --cov
      - run: uv run chokr-spec check --report conformance-report.json
      - run: uv build
      - name: Distribution metadata is valid
        run: uvx twine@7.0.0 check dist/*
      - name: Checksums
        run: cd dist && sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: release
          path: |
            dist/*
            SHA256SUMS
            conformance-report.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - name: Provenance for the distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*
            SHA256SUMS
            conformance-report.json
          generate_release_notes: true

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/chokr-spec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist/
